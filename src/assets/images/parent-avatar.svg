<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="50%" stop-color="#31103f"/>
      <stop offset="100%" stop-color="#14051a"/>
    </linearGradient>
    <linearGradient id="pSkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5327"/>
      <stop offset="100%" stop-color="#5a3314"/>
    </linearGradient>
    <linearGradient id="pClothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1851F"/>
      <stop offset="100%" stop-color="#d46107"/>
    </linearGradient>
    <linearGradient id="pScarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40BBCC"/>
      <stop offset="100%" stop-color="#1b7885"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Warm Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#pBgGrad)" stroke="#F1851F" stroke-width="4" stroke-opacity="0.45"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#F1851F" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.6"/>

  <!-- Warm Elegant Traditional Attire -->
  <path d="M85 400 C105 285, 145 265, 200 265 C255 265, 295 285, 315 400 Z" fill="url(#pClothGrad)"/>
  <!-- Elegant Scarf / Collar Accent -->
  <path d="M150 270 Q200 320 250 270 Q200 350 150 270 Z" fill="url(#pScarfGrad)"/>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="70" rx="10" fill="url(#pSkinGrad)"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#pSkinGrad)"/>

  <!-- Elegant Traditional Headwrap / Coiffure -->
  <path d="M135 165 C130 110, 270 110, 265 165 C260 125, 140 125, 135 165 Z" fill="#20100a"/>
  <ellipse cx="200" cy="135" rx="68" ry="32" fill="url(#pClothGrad)"/>
  <path d="M138 140 Q200 120 262 140 Q200 160 138 140 Z" fill="url(#pScarfGrad)"/>

  <!-- Ears with small gold hoop earrings -->
  <ellipse cx="136" cy="185" rx="8" ry="14" fill="url(#pSkinGrad)"/>
  <ellipse cx="264" cy="185" rx="8" ry="14" fill="url(#pSkinGrad)"/>
  <circle cx="134" cy="196" r="4.5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="266" cy="196" r="4.5" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- Eyebrows (Warm, caring arch) -->
  <path d="M165 156 Q180 148 193 155" stroke="#20100a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M207 155 Q220 148 235 156" stroke="#20100a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes with warm twinkle -->
  <ellipse cx="178" cy="168" rx="6.5" ry="4.5" fill="#ffffff"/>
  <ellipse cx="222" cy="168" rx="6.5" ry="4.5" fill="#ffffff"/>
  <circle cx="178" cy="168" r="3.2" fill="#23140a"/>
  <circle cx="222" cy="168" r="3.2" fill="#23140a"/>
  <circle cx="179" cy="167" r="1" fill="#ffffff"/>
  <circle cx="223" cy="167" r="1" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M196 176 Q200 192 204 176" stroke="#4a270f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M193 192 Q200 196 207 192" stroke="#4a270f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Warm Caring Smile -->
  <path d="M182 210 Q200 226 218 210" stroke="#381c08" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M186 211 Q200 220 214 211" fill="#ffffff" opacity="0.95"/>
</svg>
