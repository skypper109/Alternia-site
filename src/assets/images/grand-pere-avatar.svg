<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#314999"/>
      <stop offset="50%" stop-color="#1e2b5b"/>
      <stop offset="100%" stop-color="#0a0e1d"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5524"/>
      <stop offset="100%" stop-color="#5c3818"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1851F"/>
      <stop offset="100%" stop-color="#c46a19"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40BBCC"/>
      <stop offset="100%" stop-color="#2d99a8"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#40BBCC" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#F1851F" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.6"/>

  <!-- African Boubou / Robe -->
  <path d="M90 400 C110 300, 140 270, 200 270 C260 270, 290 300, 310 400 Z" fill="url(#clothGrad)"/>
  <!-- Gold & Cyan Traditional Embroidery Details -->
  <path d="M170 270 L200 370 L230 270 Z" fill="#ffffff" fill-opacity="0.15"/>
  <path d="M185 270 L200 350 L215 270 Z" fill="url(#accentGrad)"/>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="70" rx="10" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skinGrad)"/>

  <!-- Traditional Hat / Kufi / Chéchia -->
  <path d="M140 145 C140 100, 260 100, 260 145 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M140 145 C170 152, 230 152, 260 145 L255 130 C225 135, 175 135, 145 130 Z" fill="url(#clothGrad)"/>

  <!-- Ears -->
  <ellipse cx="132" cy="185" rx="10" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="268" cy="185" rx="10" ry="16" fill="url(#skinGrad)"/>

  <!-- Eyes & Wisdom Expression -->
  <ellipse cx="175" cy="170" rx="7" ry="5" fill="#ffffff"/>
  <ellipse cx="225" cy="170" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="175" cy="170" r="3.5" fill="#2d1d10"/>
  <circle cx="225" cy="170" r="3.5" fill="#2d1d10"/>

  <!-- White Eyebrows (Elder wisdom) -->
  <path d="M160 158 Q175 152 190 158" stroke="#f1f5f9" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M210 158 Q225 152 240 158" stroke="#f1f5f9" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M195 175 Q200 192 205 175" stroke="#5c3818" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M190 193 Q200 198 210 193" stroke="#5c3818" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Warm Smile -->
  <path d="M180 210 Q200 225 220 210" stroke="#3d210b" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Elder White Beard & Mustache -->
  <path d="M175 204 Q200 212 225 204" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M165 215 C165 270, 235 270, 235 215 C220 240, 180 240, 165 215 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Warm Light Ring on Beard -->
  <path d="M178 225 Q200 245 222 225" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
