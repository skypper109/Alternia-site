<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <defs>
    <!-- Plastic Body Gradient -->
    <radialGradient id="topCapGlowPique" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8bb0ff"/>
      <stop offset="35%" stop-color="#314999"/>
      <stop offset="100%" stop-color="#141f48"/>
    </radialGradient>
    <linearGradient id="bodyGradPique" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#192656"/>
      <stop offset="25%" stop-color="#4166d5"/>
      <stop offset="50%" stop-color="#8db0ff"/>
      <stop offset="75%" stop-color="#314999"/>
      <stop offset="100%" stop-color="#131d3f"/>
    </linearGradient>
    <radialGradient id="bottomCapGradPique" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9fc0ff"/>
      <stop offset="35%" stop-color="#3b5ec9"/>
      <stop offset="70%" stop-color="#243878"/>
      <stop offset="100%" stop-color="#0f1838"/>
    </radialGradient>
    <linearGradient id="needleGradPique" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadowFilterPique" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Pinned / Piqué Angle (~18deg rotation with realistic entry point) -->
  <g transform="rotate(18 60 80)" filter="url(#shadowFilterPique)">
    <!-- Metal Pin / Needle (Piqué dans le tableau) -->
    <polygon points="57,94 63,94 61,148 59,148" fill="url(#needleGradPique)"/>
    <polygon points="59,148 61,148 60,154" fill="#e2e8f0"/>

    <!-- Bottom Dome / Flared Base -->
    <path d="M 32,85 C 32,69 48,67 60,67 C 72,67 88,69 88,85 C 88,97 32,97 32,85 Z" fill="url(#bottomCapGradPique)"/>
    
    <!-- Glossy Highlight on Bottom Dome -->
    <ellipse cx="54" cy="75" rx="14" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(-10 54 75)"/>

    <!-- Cylindrical Center Waist -->
    <path d="M 50,29 L 70,29 L 67,69 L 53,69 Z" fill="url(#bodyGradPique)"/>
    <line x1="58" y1="30" x2="57" y2="68" stroke="#ffffff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>

    <!-- Top Cap (Rounded Disk) -->
    <ellipse cx="60" cy="23" rx="28" ry="11" fill="url(#topCapGlowPique)"/>
    <!-- Top Cap Specular Highlight -->
    <ellipse cx="56" cy="20" rx="18" ry="6" fill="#ffffff" opacity="0.65"/>
  </g>
</svg>
