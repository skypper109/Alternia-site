  <path d="M158 90 L142 90 L148 115 L144 128 L156 128 L152 115 Z" fill="url(#drumGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Wisdom / Riddles Sparkles -->
  <path d="M45 45 L47 51 L53 53 L47 55 L45 61 L43 55 L37 53 L43 51 Z" fill="#F1851F"/>
  <path d="M155 45 L157 51 L163 53 L157 55 L155 61 L153 55 L147 53 L153 51 Z" fill="#40BBCC"/>
