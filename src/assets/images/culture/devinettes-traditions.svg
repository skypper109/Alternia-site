  </defs>
  <rect width="200" height="150" rx="16" fill="#F8FAFC"/>
  <!-- Decorative background halo -->
  <circle cx="100" cy="72" r="48" fill="#40BBCC" opacity="0.12"/>
  <circle cx="100" cy="72" r="36" fill="#F1851F" opacity="0.12"/>
  
  <!-- African Mask -->
  <path d="M78 35 C78 22 122 22 122 35 C125 65 120 95 100 120 C80 95 75 65 78 35 Z" fill="url(#gradMask)" stroke="#ffffff" stroke-width="2"/>
