  <ellipse cx="112" cy="55" rx="5" ry="2.5" fill="#ffffff"/>
  <!-- Mask nose & mouth -->
  <line x1="100" y1="50" x2="100" y2="78" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="100" cy="90" rx="6" ry="3" fill="#ffffff"/>
  <!-- Mask forehead engravings -->
  <path d="M88 38 L100 46 L112 38" stroke="#FDBA74" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Side Djembe Drums / Soundwaves -->
